spring.datasource.url=jdbc:h2:mem:demo3;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.security.jwt.secret=test-demo3-demo3-demo3-demo3-demo3-demo3-secret-key
app.security.jwt.expiration-minutes=480
app.security.cors.allowed-origins=http://localhost:5173
app.security.captcha.test-code=TEST
app.websocket.stream-interval-ms=1000

app.graph.neo4j.uri=bolt://localhost:17687
app.graph.neo4j.username=neo4j
app.graph.neo4j.password=test
app.graph.neo4j.database=neo4j
app.graph.neo4j.connection-timeout-seconds=1
app.graph.neo4j.acquisition-timeout-seconds=1
app.graph.neo4j.max-connection-pool-size=1
