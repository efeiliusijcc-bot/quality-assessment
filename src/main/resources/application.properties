spring.application.name=demo3

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://74.121.148.204:5432/CCTV?reWriteBatchedInserts=true&tcpKeepAlive=true}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:passok}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true

app.security.jwt.secret=${JWT_SECRET:demo3-demo3-demo3-demo3-demo3-demo3-demo3-secret-key}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://192.168.237.1:5173}
app.websocket.stream-interval-ms=${QUALITY_STREAM_INTERVAL_MS:1000}
app.graph.neo4j.uri=${NEO4J_URI:bolt+s://api.test-link.xin:7687}
app.graph.neo4j.username=${NEO4J_USERNAME:neo4j}
app.graph.neo4j.password=${NEO4J_PASSWORD:passok123}
app.graph.neo4j.database=${NEO4J_DATABASE:neo4j}
app.graph.neo4j.connection-timeout-seconds=${NEO4J_CONNECTION_TIMEOUT_SECONDS:15}
app.graph.neo4j.acquisition-timeout-seconds=${NEO4J_ACQUISITION_TIMEOUT_SECONDS:30}
app.graph.neo4j.max-transaction-retry-seconds=${NEO4J_MAX_TRANSACTION_RETRY_SECONDS:5}
app.graph.neo4j.liveness-check-seconds=${NEO4J_LIVENESS_CHECK_SECONDS:60}
app.graph.neo4j.max-connection-pool-size=${NEO4J_MAX_CONNECTION_POOL_SIZE:50}

logging.level.org.neo4j.driver.internal.retry.ExponentialBackoffRetryLogic=ERROR
